name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: pnpm format:check
          - name: TypeScript
            command: pnpm typecheck
          - name: Lint
            command: pnpm lint
          - name: Tooling and architecture
            command: node --test tests/tooling/*.test.ts
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: ${{ matrix.command }}

  test:
    name: Tests / ${{ matrix.project }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        project: [main, renderer]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Record Git version
        run: git --version
      - run: pnpm exec vitest run --project ${{ matrix.project }}

  build:
    name: Build / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: [quality, test, desktop]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== version) throw new Error("Release tag must match package.json version (X.Y.Z, without a prefix).");'
      - name: Package desktop app and update feed
        run: pnpm package --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EDA_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Exercise native Linux update and corrupt-package rejection
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: node tests/desktop/velopack-linux.ts
      - name: Read artifact version
        id: artifact
        shell: bash
        run: |
          node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { readBuildInfo } from "./scripts/build.ts"; const { version, commit } = readBuildInfo(); if (!commit) throw new Error("Artifact naming requires a Git commit."); appendFileSync(process.env.GITHUB_OUTPUT, `name=Eda-${version}-${commit.slice(0, 12)}\n`);'
      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/velopack/*.exe
            release/velopack/*.dmg
            release/velopack/*.zip
            release/velopack/*.AppImage
            release/velopack/*.nupkg
            release/velopack/releases.*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  desktop-build:
    name: Prepare desktop test app
    needs: [quality, test]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Share Windows desktop build
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            dist/
            vendor/git/win-x64/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  desktop:
    name: Desktop UI tests / ${{ matrix.name }}
    needs: desktop-build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Profiles, tabs and keyboard shortcuts
            suites: commands workspace profiles updates
          - name: Staging, history rendering and bundled Git
            suites: local large-repo bundled-git
          - name: Merge, stashes and history recovery
            suites: foundations
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: desktop-windows
      - run: pnpm test:desktop ${{ matrix.suites }}
      - name: Save desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}-failure
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Eda-*
          merge-multiple: true
          path: release-assets
      - name: Publish installers, packages, and JSON feeds together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Eda $RELEASE_TAG" --generate-notes --prerelease
          fi
