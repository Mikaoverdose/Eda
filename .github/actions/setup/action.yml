name: Set up Eda
description: Install the project Node.js, pinned pnpm and locked dependencies

inputs:
  cache-desktop:
    description: Restore Electron binaries and packaging downloads for desktop and build jobs
    required: false
    default: "true"
  target-arch:
    description: Package architecture, when this job also downloads cross-platform packaging tools
    required: false
    default: host

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: pnpm/action-setup@v6
      with:
        cache: true

    - name: Cache Electron and packaging downloads
      if: inputs.cache-desktop == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: desktop-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target-arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          desktop-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target-arch }}-

    - run: pnpm install --frozen-lockfile
      shell: bash

    - name: Cache installed Electron binary
      if: inputs.cache-desktop == 'true'
      uses: actions/cache@v5
      with:
        path: |
          node_modules/electron/dist
          node_modules/electron/path.txt
        key: electron-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Ensure Electron binary is installed
      if: inputs.cache-desktop == 'true'
      run: pnpm exec install-electron
      shell: bash
